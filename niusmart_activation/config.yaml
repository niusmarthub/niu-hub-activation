name: "Niu Hub Activation"
version: "0.4.7"
slug: "niu_activation"
# Image multiarchitecture construite et publiee par GitHub Actions.
# Le Supervisor telecharge la version correspondante au lieu de compiler sur le hub.
image: "ghcr.io/niusmarthub/niu-hub-activation"
description: "Activation NiuSmart, synchronisation des options du site et protection des cles API"
url: "https://niusmart.com"
startup: application
boot: auto
init: false
webui: "http://[HOST]:[PORT:8099]/"
hassio_api: true
homeassistant_api: true
hassio_role: manager
# Acces aux broadcasts LAN Tuya (UDP 6666/6667/7000).
host_network: true
privileged:
  - NET_ADMIN
host_dbus: true
arch:
  - aarch64
  - amd64
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "Interface d'activation Niu Hub (reseau local uniquement)"
options:
  local_tablet: false
  bms_sync: false
schema:
  local_tablet: bool
  bms_sync: bool
  solar_bluetooth_address: str?
  netbird_setup_key: password?
  netbird_repository: url?
services:
  - mqtt:want

# Acces explicite au fichier de configuration Home Assistant.
map:
  - type: homeassistant_config
    read_only: false
