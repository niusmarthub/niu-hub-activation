name: "Niu Hub Activation"
version: "0.3.26"
slug: "niu_activation"
description: "Activation NiuSmart, synchronisation des options du site et protection des cles API"
url: "https://niusmart.com"
startup: application
boot: auto
init: false
webui: "http://[HOST]:[PORT:8099]/"
hassio_api: true
homeassistant_api: true
hassio_role: manager
# Acces aux broadcasts LAN Tuya (UDP 6666/6667/7000).
host_network: true
privileged:
  - NET_ADMIN
host_dbus: true
arch:
  - aarch64
  - armv7
  - amd64
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "Interface d'activation Niu Hub (reseau local uniquement)"
options: {}
schema:
  solar_bluetooth_address: str?
  netbird_setup_key: password?
  netbird_repository: url?
services:
  - mqtt:want

# Acces explicite au fichier de configuration Home Assistant.
map:
  - type: homeassistant_config
    read_only: false
