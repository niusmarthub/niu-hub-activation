name: Build Niu Hub Activation images
on:
  push:
    branches: [main]
    paths:
      - "niusmart_activation/**"
      - ".github/workflows/build-addon-image.yml"
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: addon-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python and addon metadata
        run: |
          python3 -m compileall -q niusmart_activation
          python3 - <<'PY'
          import pathlib, yaml
          cfg = yaml.safe_load(pathlib.Path("niusmart_activation/config.yaml").read_text())
          assert cfg["version"] == "0.4.1", "Version mismatch"
          assert "aarch64" in cfg["arch"]
          PY
      - name: Verify Dockerfile build context
        run: |
          docker build --platform linux/amd64 --tag niu-addon-validation:local niusmart_activation
  publish:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish prebuilt multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: ./niusmart_activation
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ghcr.io/niusmarthub/niu-hub-activation:0.4.1
          provenance: false
