name: Build Niu Hub Activation images
on:
  push:
    branches: [main]
    paths:
      - "niusmart_activation/**"
      - ".github/workflows/build-addon-image.yml"
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: addon-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python and addon metadata
        run: |
          python3 -m pip install --quiet PyYAML
          python3 -m compileall -q niusmart_activation
          python3 - <<'PY'
          import pathlib, yaml
          cfg = yaml.safe_load(pathlib.Path("niusmart_activation/config.yaml").read_text())
          assert cfg["version"] == "0.4.1", "Version mismatch"
          assert cfg["arch"] == ["aarch64", "amd64"]
          assert cfg["image"] == "ghcr.io/niusmarthub/niu-hub-activation"
          PY
      - name: Verify Dockerfile build context
        run: |
          docker build --platform linux/amd64 --tag niu-addon-validation:local niusmart_activation
  publish:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish prebuilt multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: ./niusmart_activation
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/niusmarthub/niu-hub-activation:0.4.1
          provenance: false

  verify-public-image:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Verify anonymous pull and both architectures
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          base = "https://ghcr.io"
          image = "niusmarthub/niu-hub-activation"
          tag = "0.4.1"
          token_url = base + "/token?scope=repository:" + image + ":pull&service=ghcr.io"
          with urllib.request.urlopen(token_url, timeout=30) as response:
              token = json.load(response)["token"]
          request = urllib.request.Request(
              base + "/v2/" + image + "/manifests/" + tag,
              headers={
                  "Authorization": "Bearer " + token,
                  "Accept": "application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              manifest = json.load(response)
          architectures = {
              (item["platform"]["os"], item["platform"]["architecture"])
              for item in manifest.get("manifests", [])
          }
          required = {("linux", "arm64"), ("linux", "amd64")}
          assert required <= architectures, f"Missing image architectures: {required - architectures}"
          print("Public anonymous pull verified:", sorted(architectures))
          PY
